name: Mapa Graphify
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Instalar Graphify y crear mapa
        run: |
          pip install graphifyy
          graphify update .
      - name: Guardar mapa en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add graphify-out/
          git diff --staged --quiet || git commit -m "Actualizar mapa Graphify [skip ci]"
          git push
          
